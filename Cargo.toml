# RustZeroHour Cargo workspace.
#
# The C++ tree stays in place until the cut-over milestone (M5) of the Rust
# migration plan (docs/RUST_MIGRATION_PLAN.md). Crates are added here as the
# migration proceeds; see the plan's §3.4 for the target layout.

[workspace]
resolver = "3"
members = [
    "crates/rzh-compress",
    "crates/rzh-ini",
    "crates/rzh-log",
    "crates/rzh-math",
    "crates/rzh-util",
    "crates/rzh-vfs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV 1.91: u32::carrying_add (the RNG's hardware add-with-carry chain,
# docs/benchmarks.md) stabilized there. CI builds with the pinned toolchain
# (rust-toolchain.toml); this line is the portability claim for packagers.
rust-version = "1.91"
license = "GPL-3.0-or-later"
repository = "https://github.com/RustZeroHour/RustZeroHour"

[workspace.dependencies]
# Property-testing framework (plan §6 test layers). Pinned at the workspace
# level so every crate's dev-dependency agrees on one version. Default
# features are trimmed to `std`: the `fork` machinery (tempfile, rustix)
# and `bit-set` are not used by our suites.
proptest = { version = "1.7", default-features = false, features = ["std"] }

# Benchmarking framework (plan §5 candidate crates, §6 exit criterion:
# "benchmarks within budget"). Criterion 0.7 is the newest line that keeps
# the workspace MSRV (rust-version 1.85); 0.8 requires 1.86. Default
# features are trimmed to `cargo_bench_support`: no plotters/rayon/csv —
# the terminal estimates are what the §6 budget check reads, and the
# smaller graph keeps cargo-deny clean.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
# Documentation is part of the definition of done for every ported unit.
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Determinism note (plan §3.3): the simulation crates use f32 with the same
# operation order as the C++ original and no fast-math; release profiles must
# not change floating-point behaviour.
[profile.release]
opt-level = 3
debug = true
panic = "unwind"
