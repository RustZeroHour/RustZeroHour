# Rust CI for the RustZeroHour workspace (migration plan §4, Phase 0).
#
# Runs on every change that touches the Rust stack: formatting, clippy with
# warnings denied, the full test suite (including the differential golden
# vectors), a compile check of the §6 benchmarks, and the license/advisory
# checks via cargo-deny.
#
# The legacy C++ CI (ci.yml) keeps running unchanged until the cut-over
# milestone (M5); both stacks are green at the same time by design.

name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.rustfmt.toml'
      - 'deny.toml'
      - '.github/workflows/rust-ci.yml'
      - 'tools/differential/**'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.rustfmt.toml'
      - 'deny.toml'
      - '.github/workflows/rust-ci.yml'
      - 'tools/differential/**'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The §6 benchmarks must at least compile on every platform; actually
      # running them in CI would be flaky on shared runners (the budget
      # comparison runs on dev machines and is recorded in docs/benchmarks.md).
      - name: Bench compile check
        run: cargo bench --workspace --no-run

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace
