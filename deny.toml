# cargo-deny configuration (plan §4, Phase 0 and §7).
#
# The Rust port is a derivative work of GPL-3.0 code and stays GPL-3.0-or-later.
# Dependency licenses must be GPL-compatible; permissive licenses listed below
# are fine because we distribute under GPL.

[graph]
# Check the whole workspace, all targets.
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]

[bans]
# Duplicate versions are a maintenance smell; warn rather than deny while the
# workspace is small, tighten once the dependency graph settles.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[advisories]
version = 2
yanked = "deny"
ignore = []
