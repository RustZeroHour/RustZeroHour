Locomotor HoverLocomotor
  Surfaces = GROUND WATER
  Speed = 60
  TurnRate = 120
  Acceleration = 2000
  Appearance = HOVER
  ZAxisBehavior = SEA_LEVEL
  StickToGround = Yes
  UnknownLocoField = 7      ; unknown fields are skipped in release builds
End

Locomotor ThrustLocomotor
  Surfaces = AIR
  Speed = 90
  TurnRate = 60
  Acceleration = 3000
  MinSpeed = 10
  Appearance = THRUST
End

Locomotor WingLocomotor
  Surfaces = AIR
  Speed = 120
  MinSpeed = 40
  MinTurnSpeed = 30
  Appearance = WINGS
  Lift = 0
End

; WINGS with no MinSpeed/MinTurnSpeed: validate() heals the
; non-positive one to 0.01 and leaves the BIGNUM default alone.
Locomotor WingHealLocomotor
  Surfaces = AIR
  Appearance = WINGS
  Speed = 100
End

; Relative bit-string edits start from the current (default) value.
Locomotor RelativeSurfacesLocomotor
  Surfaces = +GROUND +AIR -RUBBLE
End
