; full-line comment

; Same-line junk after the block name is silently discarded (the field
; loop always starts on the next line).
Armor EdgeArmor	Armor = Default 50%
End

Armor LongLineArmor
  Armor = Default 100% ; ............................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................................
  Armor = CRUSH 200%
End

Armor CtrlArmor
  Armor = Default 100%
End
