# rzh-formats: the Zero Hour asset-format parsers for RustZeroHour.
#
# Ported from (baseline 571a7c5, Zero Hour configuration):
#   Core/GameEngine/Source/GameClient/GameText.cpp   (CSF runtime reader:
#                                                     getCSFInfo, parseCSF, stripSpaces)
#   Core/Tools/Babylon/expimp.{h,cpp}                (CSF writer: CSF_HEADER,
#                                                     generate_csf, writeCSFLabel, writeCSFString)
#   Core/Libraries/Source/WWVegas/WWLib/chunkio.{h,cpp}
#                                                     (the W3D chunk container:
#                                                     ChunkSaveClass, ChunkLoadClass)
#   GeneralsMD/Code/Libraries/Source/WWVegas/WW3D2/meshmdlio.cpp
#                                                     (the W3D mesh chunk tree:
#                                                     MeshModelClass::Load_W3D and
#                                                     the sub-readers)
#   GeneralsMD/Code/Libraries/Source/WWVegas/WW3D2/meshgeometry.cpp, vertmaterial.cpp,
#   shader.{h,cpp}, w3d_util.cpp, meshmatdesc.{h,cpp}, aabtree.cpp, texture.cpp,
#   Core/Libraries/Source/WWVegas/WWLib/realcrc.cpp
#                                                     (the geometry/material/AABTree/
#                                                     texture data paths the mesh
#                                                     loader drives, the ShaderClass
#                                                     bit packing, the WWLib CRC-32)
#   Core/Libraries/Source/WWVegas/WW3D2/htree.{h,cpp} (the W3D hierarchy trees:
#                                                     HTreeClass::Load_W3D,
#                                                     read_pivots, the bone lookups)
#   Core/Libraries/Source/WWVegas/WW3D2/pivot.{h,cpp} (the PivotClass state
#                                                     the pivot array is born with)
#   Core/Libraries/Source/WWVegas/WWMath/quat.h      (Build_Matrix3D — the
#                                                     quaternion-to-rotation
#                                                     builder, mixed f64/f32
#                                                     literals included)
#   Core/Libraries/Source/WWVegas/WWMath/matrix3d.h  (Make_Identity,
#                                                     Translate(const Vector3&),
#                                                     postMul — the base-pose
#                                                     formulas read_pivots drives)
#
# Original: Copyright 2025 Electronic Arts Inc.
# Rust port Copyright 2026 the RustZeroHour contributors.
#
# This crate is stage B of the migration plan (§3.1, "Data"): parsing only.
# It turns asset bytes into typed structures and back, byte-exactly
# (parity level P0, golden-pinned). Game-side normalizations that the
# original applies on top of the parsed data (e.g. the string manager's
# space stripping) are exposed as explicit helpers so the future
# consumer crates keep the original behaviour without hiding it in the
# parser. Malformed input returns Result errors where the C++ reads out
# of bounds (see each module's "Differences from the C++" notes).

[package]
name = "rzh-formats"
description = "Zero Hour asset format parsers: CSF string tables, TGA textures, the W3D chunk container, the W3D mesh chunk tree and the W3D hierarchy trees (animations, HLOD, map, WND, DDS follow)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gamedev", "rts", "zerohour", "file-format", "w3d"]
categories = ["game-development", "parser-implementations"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
# Intentionally empty: a format parser must stay dependency-free so the
# data path is auditable byte-for-byte (same policy as rzh-util).

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

# §6 discipline: every ported unit gets a benchmark compared against the
# C++ baseline (tools/differential/bench_baseline.sh, docs/benchmarks.md).
# Run with `cargo bench -p rzh-formats`.
[[bench]]
name = "rzh_formats"
harness = false
