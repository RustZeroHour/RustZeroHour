# rzh-sim: the deterministic headless simulation kernel for RustZeroHour.
#
# Ported from (baseline 571a7c5, Zero Hour configuration):
#   GeneralsMD/Code/GameEngine/Source/GameLogic/System/GameLogic.cpp
#                                                     (the frame loop:
#                                                     GameLogic::update's
#                                                     ordered subsystem walk,
#                                                     preUpdate's pause-frame
#                                                     transition, the object
#                                                     registry — allocateObjectID,
#                                                     registerObject, destroyObject,
#                                                     processDestroyList with its
#                                                     two-pass sleepy erase and
#                                                     the destroy-during-destroy
#                                                     same-pass append, and
#                                                     loadPostProcess's ID
#                                                     compaction and heap rebuild)
#   GeneralsMD/Code/GameEngine/Include/GameLogic/GameLogic.h
#                                                     (the kernel's state half)
#   GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/UpdateModule.cpp
#   GeneralsMD/Code/GameEngine/Include/GameLogic/Module/UpdateModule.h
#                                                     (the sleepy-update
#                                                     scheduler: the packed
#                                                     m_nextCallFrameAndPhase
#                                                     priority with its
#                                                     UPDATE_SLEEP_FOREVER
#                                                     saturation, setWakeFrame,
#                                                     frameToSleepTime)
#   GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Object.cpp
#                                                     (the kernel's object
#                                                     state: setDisabledUntil's
#                                                     frame > now mask write,
#                                                     checkDisabledStatus's
#                                                     now >= tillFrame re-enable,
#                                                     reactToTransformChange's
#                                                     0.01 position/angle
#                                                     thresholds, setGeometryInfo's
#                                                     unregister/re-register — and
#                                                     onCollide's behavior walk with
#                                                     its per-module NO_COLLISIONS
#                                                     re-check and mid-walk break)
#   GeneralsMD/Code/GameEngine/Source/GameLogic/Object/PartitionManager.cpp
#   GeneralsMD/Code/GameEngine/Include/GameLogic/PartitionManager.h
#                                                     (the spatial store: the
#                                                     cell grid, the COI coverage
#                                                     with calcMaxCoiForShape,
#                                                     doSmallFill, doCircleFillPrecise
#                                                     and doRectFill, the dirty
#                                                     -module refresh with its
#                                                     LIFO order and contact
#                                                     -pair collection, register/
#                                                     unRegisterObject — the
#                                                     collide-test family: CollideInfo
#                                                     / CollideLocAndNormal, the
#                                                     rectToFourPoints / testRotated
#                                                     PointsAgainstRect pair, the
#                                                     xy_collideTest quartet with its
#                                                     Rect_Circle square promotion,
#                                                     the z_collideTest composites with
#                                                     the sphere-slice radii and the
#                                                     closeEnough preflight, the
#                                                     theCollideTestProcs matrix,
#                                                     PartitionData::collidesWith with
#                                                     its KINDOF_NO_COLLIDE refusal
#                                                     and below-extent z-gate,
#                                                     PartitionManager::geomCollides
#                                                     WithGeom with its narrower raw-z
#                                                     gate, and the contact list's
#                                                     processContactList with the
#                                                     removeSpecificPartitionData
#                                                     null-only cleanup — and the
#                                                     query family: calcMinRadius /
#                                                     calcRadiusVec, the four
#                                                     distCalcProc_X_Y measures and
#                                                     theDistCalcProcs,
#                                                     getClosestObjects with its
#                                                     done-flag dedup and
#                                                     maxRadiusLimit early exit,
#                                                     the getClosestObject /
#                                                     iterateObjectsInRange /
#                                                     iteratePotentialCollisions /
#                                                     iterateAllObjects wrappers,
#                                                     the getVectorTo /
#                                                     getDistanceSquared /
#                                                     getGoalDistanceSquared /
#                                                     getRelativeAngle2D measures,
#                                                     filtersAllow and the
#                                                     PartitionFilterWouldCollide /
#                                                     AcceptByKindOf / RejectByKindOf
#                                                     / Alive / OnMap /
#                                                     SameMapStatus filters, HUGE_DIST
#                                                     and DistanceCalculationType)
#   GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SimpleObjectIterator.cpp
#   GeneralsMD/Code/GameEngine/Include/GameLogic/ObjectIter.h
#                                                     (the SimpleObjectIterator: the
#                                                     clump list with its prepend
#                                                     insert and nextWithNumeric,
#                                                     and sort()'s bottom-up
#                                                     linked-list mergesort with the
#                                                     five ClumpCompareProcs and
#                                                     IterOrderType)
#   GeneralsMD/Code/GameEngine/Source/Common/Thing/Thing.cpp
#   GeneralsMD/Code/GameEngine/Include/Common/Thing.h
#                                                     (getUnitDirectionVector2D —
#                                                     Cos/Sin of the facing angle;
#                                                     isKindOfMulti's mask test)
#   GeneralsMD/Code/GameEngine/Source/Common/Thing/ThingFactory.cpp
#                                                     (the newObject shape the
#                                                      corpus creation mirrors)
#   GeneralsMD/Code/GameEngine/Source/Common/System/Geometry.cpp
#   GeneralsMD/Code/GameEngine/Include/Common/Geometry.h
#                                                     (the collide and query
#                                                     families' geometry surface:
#                                                     getMaxHeightAbovePosition /
#                                                     getMaxHeightBelowPosition /
#                                                     getZDeltaToCenterPosition and
#                                                     the calcBoundingStuff
#                                                     bounding-circle/sphere radii —
#                                                     computed on demand from the
#                                                     same five inputs the cached
#                                                     original recomputes in every
#                                                     setter, identical values;
#                                                     setMajorRadius / setMinorRadius)
#   Core/Libraries/Source/Lib/Include/Lib/Coord3D.h     (Coord3D::normalize — the
#                                                      length via the pinned sqrt
#                                                      and the len != 0 guard)
#   Core/Libraries/Source/Lib/Include/Lib/BaseFunctions.h
#                                                     (fast_float_trunc/floor/
#                                                     ceil — the Hoffesommer bit
#                                                     tricks — and the
#                                                     REAL_TO_INT_CEIL/FLOOR
#                                                     composites of the Zero Hour
#                                                     non-retail build)
#   Core/Libraries/Source/Lib/Trig.cpp               (Cos/Sin — the gm_cosf/
#                                                     gm_sinf deterministic
#                                                     branches, supplied by
#                                                     rzh-math's pinned GameMath
#                                                     port)
#   Core/GameEngine/Include/Common/GameCommon.h,
#   Core/Libraries/Source/WWVegas/WWLib/WWCommon.h    (WWSyncPerSecond = 30 and
#                                                     the derived frame reals)
#   Core/GameEngine/Include/Common/GameType.h         (ObjectID, INVALID_ID)
#   Core/GameEngine/Include/Common/DisabledTypes.h    (the 13 disabled types)
#   Core/GameEngine/Include/Common/Geometry.h         (GeometryType)
#   Core/GameEngine/Include/Common/KindOf.h           (the IMMOBILE bit the
#                                                     store consults)
#
# Original: Copyright 2025 Electronic Arts Inc.
# Rust port Copyright 2026 the RustZeroHour contributors.
#
# This crate is stage C of the migration plan (§3.4, "Sim"): the Phase 3
# WP1 kernel. It is deterministic, single-threaded, I/O-free and
# rendering-free by construction (plan §3.3 rules 5-7): no unsafe, no
# wall-clock, no HashMap iteration, objects referenced by ID. The sleepy
# update ordering, the ID allocation, the destroy-list semantics and the
# partition coverage are pinned byte-exactly (P0 for the discrete state)
# against tools/differential/gen_kernel_golden.cpp — the C++
# transcription of the same paths.

[package]
name = "rzh-sim"
description = "Zero Hour deterministic simulation kernel: the frame loop, the object registry with its sleepy-update scheduler, the partition-manager spatial store and its query family"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gamedev", "rts", "zerohour", "simulation", "deterministic"]
categories = ["game-development"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
# The deterministic math crate: the pinned GameMath trig (gm_sinf/gm_cosf)
# the rect fill drives and the correctly-rounded sqrt the COI bounds use
# (ADR-001: bit-identical to the pin, so the crate stays pure Rust).
rzh-math = { path = "../rzh-math", version = "0.1.0" }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

# §6 discipline: every ported unit gets a benchmark compared against the
# C++ baseline (tools/differential/bench_baseline.sh, docs/benchmarks.md).
# Run with `cargo bench -p rzh-sim`.
[[bench]]
name = "rzh_sim"
harness = false
