# rzh-util: shared utilities for the RustZeroHour engine.
#
# Ported from (baseline 571a7c5, Zero Hour configuration):
#   Core/GameEngine/Include/Common/crc.h
#   Core/GameEngine/Source/Common/crc.cpp
#   Core/GameEngine/Source/Common/RandomValue.cpp (non-retail branches)
#   GeneralsMD/Code/GameEngine/Include/Common/NameKeyGenerator.h
#   GeneralsMD/Code/GameEngine/Source/Common/NameKeyGenerator.cpp
#
# This crate is part of the simulation dependency graph and therefore follows
# the plan's determinism rules (docs/RUST_MIGRATION_PLAN.md §3.3): no unsafe
# code, fixed-width integer types only, f32 with the original operation order.

[package]
name = "rzh-util"
description = "Zero Hour engine utilities: game CRC, deterministic RNGs and name-key interning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["gamedev", "rts", "zerohour", "crc", "rng", "interning"]
categories = ["game-development"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
# Intentionally empty: this is a foundation crate and must stay dependency-free.

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

# §6 exit criterion: criterion benchmarks for the Phase 1 foundation
# algorithms. Run with `cargo bench -p rzh-util`.
[[bench]]
name = "rzh_util"
harness = false
